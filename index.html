<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>專業雙模式計算機 App</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="計算機">
    <meta name="theme-color" content="#2563eb">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body {
            font-family: 'Inter', 'Microsoft JhengHei', sans-serif;
            background-color: #f8fafc;
            overscroll-behavior-y: contain;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .calc-button {
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .calc-button:active {
            transform: scale(0.92);
            filter: brightness(0.9);
        }

        @media (max-width: 768px) {
            .app-container {
                height: 100vh;
                height: -webkit-fill-available;
                border-radius: 0;
                padding-top: var(--safe-top);
                padding-bottom: var(--safe-bottom);
            }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .currency-base-active {
            background-color: #2563eb !important;
            color: white !important;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        /* 模式切換樣式 */
        .mode-active {
            color: #2563eb;
            border-bottom: 2px solid #2563eb;
        }

        /* 隱藏匯率區域的動畫 */
        .mode-transition {
            transition: all 0.3s ease-in-out;
            overflow: hidden;
        }

        /* 音效／震動開關 */
        .setting-toggle {
            -webkit-tap-highlight-color: transparent;
            transition: opacity 0.15s ease;
        }
        .setting-toggle.is-off { opacity: 0.3; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-100 md:p-4">

    <div class="app-container bg-white shadow-2xl md:rounded-3xl overflow-hidden w-full max-w-4xl flex flex-col md:flex-row border border-slate-200">

        <!-- 左側：計算機主體 -->
        <div class="flex-1 p-6 flex flex-col justify-between">
            <div class="flex justify-between items-center mb-4">
                <!-- 模式切換頁籤 -->
                <div class="flex space-x-6">
                    <button onclick="switchMode('normal')" id="mode-normal" class="text-sm font-bold pb-1 mode-active transition-all">一般計算</button>
                    <button onclick="switchMode('currency')" id="mode-currency" class="text-sm font-bold pb-1 text-slate-400 transition-all">匯率換算</button>
                </div>

                <div class="flex items-center space-x-2">
                    <!-- 匯率狀態 (僅在匯率模式顯示，點擊可重新整理) -->
                    <button id="rate-status" onclick="fetchRates()" class="hidden text-[10px] bg-blue-50 text-blue-500 px-2 py-1 rounded-full font-medium">
                        正在獲取匯率...
                    </button>
                    <!-- 回饋開關 -->
                    <button id="toggle-sound" onclick="toggleSetting('sound')" class="setting-toggle text-base leading-none p-1" aria-label="按鍵音效" title="按鍵音效">🔊</button>
                    <button id="toggle-vibrate" onclick="toggleSetting('vibrate')" class="setting-toggle text-base leading-none p-1" aria-label="震動回饋" title="震動回饋">📳</button>
                </div>
            </div>

            <!-- 顯示螢幕 -->
            <div id="calc-screen" class="bg-slate-50 rounded-2xl p-6 mb-4 text-right flex flex-col justify-end border border-slate-100 shadow-inner flex-grow md:flex-grow-0 min-h-[160px] transition-all duration-300">
                <div id="display-formula" class="text-slate-400 text-sm md:text-base font-medium mb-1 break-all h-6 overflow-hidden"></div>

                <div class="flex items-baseline justify-end space-x-2 overflow-hidden">
                    <span id="base-symbol" class="hidden text-blue-600 font-bold text-lg">TWD</span>
                    <div id="display-current" class="text-slate-800 text-4xl md:text-5xl font-semibold break-all">0</div>
                </div>

                <!-- 匯率擴展區 (預設隱藏) -->
                <div id="currency-area" class="hidden mt-6 pt-4 border-t border-slate-200/60 flex flex-col space-y-4 mode-transition">
                    <!-- 基準幣別選擇器 -->
                    <div class="flex items-center space-x-2">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">基準幣別:</span>
                        <div class="flex bg-slate-200/50 p-1 rounded-lg">
                            <button onclick="changeBaseCurrency('TWD')" id="btn-twd" class="currency-base-active px-3 py-1 rounded-md text-[10px] font-bold transition-all">TWD</button>
                            <button onclick="changeBaseCurrency('USD')" id="btn-usd" class="px-3 py-1 rounded-md text-[10px] font-bold text-slate-500 hover:text-slate-700 transition-all">USD</button>
                            <button onclick="changeBaseCurrency('JPY')" id="btn-jpy" class="px-3 py-1 rounded-md text-[10px] font-bold text-slate-500 hover:text-slate-700 transition-all">JPY</button>
                        </div>
                    </div>

                    <!-- 換算結果 -->
                    <div id="conversion-display" class="flex items-center space-x-6 overflow-x-auto no-scrollbar">
                        <!-- 動態生成 -->
                    </div>
                </div>
            </div>

            <!-- 按鍵區 -->
            <div class="grid grid-cols-4 gap-3">
                <button onclick="handleAction(() => clearAll())" class="calc-button col-span-2 bg-red-50 text-red-600 font-bold py-5 rounded-2xl">AC</button>
                <button onclick="handleAction(() => deleteLast())" class="calc-button bg-slate-100 text-slate-600 font-bold py-5 rounded-2xl">DEL</button>
                <button onclick="handleAction(() => appendOperator('/'))" class="calc-button bg-blue-50 text-blue-600 font-bold py-5 rounded-2xl hover:bg-blue-100">÷</button>

                <button onclick="handleAction(() => appendNumber('7'))" class="calc-button bg-white text-slate-700 font-semibold py-5 rounded-2xl border border-slate-200 shadow-sm">7</button>
                <button onclick="handleAction(() => appendNumber('8'))" class="calc-button bg-white text-slate-700 font-semibold py-5 rounded-2xl border border-slate-200 shadow-sm">8</button>
                <button onclick="handleAction(() => appendNumber('9'))" class="calc-button bg-white text-slate-700 font-semibold py-5 rounded-2xl border border-slate-200 shadow-sm">9</button>
                <button onclick="handleAction(() => appendOperator('*'))" class="calc-button bg-blue-50 text-blue-600 font-bold py-5 rounded-2xl hover:bg-blue-100">×</button>

                <button onclick="handleAction(() => appendNumber('4'))" class="calc-button bg-white text-slate-700 font-semibold py-5 rounded-2xl border border-slate-200 shadow-sm">4</button>
                <button onclick="handleAction(() => appendNumber('5'))" class="calc-button bg-white text-slate-700 font-semibold py-5 rounded-2xl border border-slate-200 shadow-sm">5</button>
                <button onclick="handleAction(() => appendNumber('6'))" class="calc-button bg-white text-slate-700 font-semibold py-5 rounded-2xl border border-slate-200 shadow-sm">6</button>
                <button onclick="handleAction(() => appendOperator('-'))" class="calc-button bg-blue-50 text-blue-600 font-bold py-5 rounded-2xl hover:bg-blue-100">−</button>

                <button onclick="handleAction(() => appendNumber('1'))" class="calc-button bg-white text-slate-700 font-semibold py-5 rounded-2xl border border-slate-200 shadow-sm">1</button>
                <button onclick="handleAction(() => appendNumber('2'))" class="calc-button bg-white text-slate-700 font-semibold py-5 rounded-2xl border border-slate-200 shadow-sm">2</button>
                <button onclick="handleAction(() => appendNumber('3'))" class="calc-button bg-white text-slate-700 font-semibold py-5 rounded-2xl border border-slate-200 shadow-sm">3</button>
                <button onclick="handleAction(() => appendOperator('+'))" class="calc-button bg-blue-50 text-blue-600 font-bold py-5 rounded-2xl hover:bg-blue-100">+</button>

                <button onclick="handleAction(() => appendNumber('0'))" class="calc-button bg-white text-slate-700 font-semibold py-5 rounded-2xl border border-slate-200 shadow-sm">0</button>
                <button onclick="handleAction(() => appendNumber('.'))" class="calc-button bg-white text-slate-700 font-semibold py-5 rounded-2xl border border-slate-200 shadow-sm">.</button>
                <button onclick="handleAction(() => calculate())" class="calc-button col-span-2 bg-blue-600 text-white font-bold py-5 rounded-2xl shadow-lg shadow-blue-200 hover:bg-blue-700">=</button>
            </div>
        </div>

        <!-- 右側：歷史紀錄區 -->
        <div class="w-full md:w-72 bg-slate-50 p-6 md:p-8 border-t md:border-t-0 md:border-l border-slate-200 overflow-y-auto no-scrollbar">
            <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4">最近 5 筆紀錄</h2>
            <div id="history-list" class="space-y-3">
                <div class="text-slate-400 text-xs italic">尚無歷史紀錄</div>
            </div>
        </div>
    </div>

    <script>
        // ================= 小工具 =================
        function loadJSON(key) {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }
        function saveJSON(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 私密模式等情況忽略 */ }
        }

        // ================= 設定（音效／震動） =================
        const settings = Object.assign({ sound: true, vibrate: true }, loadJSON('calc-settings'));

        function renderSettings() {
            const soundBtn = document.getElementById('toggle-sound');
            const vibrateBtn = document.getElementById('toggle-vibrate');
            soundBtn.textContent = settings.sound ? '🔊' : '🔇';
            soundBtn.classList.toggle('is-off', !settings.sound);
            soundBtn.setAttribute('aria-pressed', settings.sound);
            vibrateBtn.classList.toggle('is-off', !settings.vibrate);
            vibrateBtn.setAttribute('aria-pressed', settings.vibrate);
        }

        function toggleSetting(name) {
            settings[name] = !settings[name];
            saveJSON('calc-settings', settings);
            renderSettings();
            // 開啟時立刻給一次回饋，讓使用者確認有作用
            if (settings[name]) {
                if (name === 'sound') playSound();
                else vibrate(true);
            }
        }

        // ================= 按鍵回饋 =================
        let audioCtx = null;

        function getAudioCtx() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                audioCtx = new AC();
            }
            return audioCtx;
        }

        function beep(ctx) {
            const t = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, t);
            // 先極短淡入再淡出，避免爆音
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(0.08, t + 0.005);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(t);
            osc.stop(t + 0.07);
        }

        function playSound() {
            if (!settings.sound) return;
            const ctx = getAudioCtx();
            if (!ctx) return;
            if (ctx.state === 'running') {
                beep(ctx);
            } else {
                // suspended / interrupted（iOS 切到背景後）：等恢復後再播放，不會漏掉
                ctx.resume().then(() => beep(ctx)).catch(() => {});
            }
        }

        // iOS 需要在 touchend / click 這類手勢內「解鎖」音訊
        function unlockAudio() {
            if (!settings.sound) return;
            const ctx = getAudioCtx();
            if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {});
        }
        document.addEventListener('touchend', unlockAudio, { passive: true });
        document.addEventListener('click', unlockAudio);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && audioCtx && audioCtx.state !== 'running') {
                audioCtx.resume().catch(() => {});
            }
        });

        // 震動：Android 用 Vibration API；iPhone（iOS 18+ Safari）不支援，
        // 改用點擊隱藏的 <input switch> 開關來觸發系統觸覺回饋
        const supportsVibrate = typeof navigator.vibrate === 'function';

        function vibrate(strong) {
            if (!settings.vibrate) return;
            if (supportsVibrate) {
                navigator.vibrate(strong ? 30 : 15);
                return;
            }
            try {
                const label = document.createElement('label');
                label.setAttribute('aria-hidden', 'true');
                label.style.display = 'none';
                const input = document.createElement('input');
                input.type = 'checkbox';
                input.setAttribute('switch', '');
                label.appendChild(input);
                document.head.appendChild(label);
                label.click();
                document.head.removeChild(label);
            } catch (e) { /* 不支援就略過 */ }
        }

        function feedback() {
            playSound();
            vibrate();
        }

        function isFeedbackTarget(e) {
            const target = e.target.closest && e.target.closest('button, .history-item');
            return target && !target.classList.contains('setting-toggle');
        }

        // 在手指「按下」的瞬間就回饋，不必等放開（click）才觸發，快速連按也不會漏
        document.addEventListener('pointerdown', (e) => {
            if (e.button > 0 || !isFeedbackTarget(e)) return;
            playSound();
            if (supportsVibrate) vibrate();
        }, { passive: true });

        // iPhone 的觸覺回饋必須在 click（真正的使用者手勢）裡觸發
        document.addEventListener('click', (e) => {
            if (!supportsVibrate && e.isTrusted && isFeedbackTarget(e)) vibrate();
        });

        // ================= 計算機狀態 =================
        let currentInput = '0';
        let formula = '';
        let history = [];
        let isResultDisplayed = false;
        let waitingForOperand = false;   // 剛按完運算子，還沒輸入下一個數字
        let isError = false;
        let currentAppMode = 'normal'; // 'normal' 或 'currency'

        const MAX_DIGITS = 15;
        const OP_SYMBOLS = { '+': '+', '-': '−', '*': '×', '/': '÷' };

        const rateStatus = document.getElementById('rate-status');
        const conversionDisplay = document.getElementById('conversion-display');
        const baseSymbol = document.getElementById('base-symbol');
        const currencyArea = document.getElementById('currency-area');
        const calcScreen = document.getElementById('calc-screen');
        const displayCurrent = document.getElementById('display-current');
        const displayFormula = document.getElementById('display-formula');
        const historyList = document.getElementById('history-list');

        function handleAction(callback) {
            if (callback) callback();
            if (currentAppMode === 'currency') updateConversions();
        }

        // ================= 模式切換 =================
        function setTabActive(id, active) {
            const el = document.getElementById(id);
            el.classList.toggle('mode-active', active);
            el.classList.toggle('text-slate-400', !active);
        }

        function switchMode(mode) {
            if (currentAppMode === mode) return;
            currentAppMode = mode;
            const isCurrency = mode === 'currency';

            setTabActive('mode-currency', isCurrency);
            setTabActive('mode-normal', !isCurrency);
            currencyArea.classList.toggle('hidden', !isCurrency);
            baseSymbol.classList.toggle('hidden', !isCurrency);
            rateStatus.classList.toggle('hidden', !isCurrency);
            if (isCurrency) calcScreen.classList.replace('min-h-[160px]', 'min-h-[220px]');
            else calcScreen.classList.replace('min-h-[220px]', 'min-h-[160px]');

            if (isCurrency) {
                updateConversions();
                const stale = !ratesUpdatedAt || Date.now() - ratesFetchedAt > 60 * 60 * 1000;
                if (!usdRates || stale) fetchRates();
            }
        }

        // ================= 匯率 =================
        const CURRENCIES = ['TWD', 'USD', 'JPY'];
        let baseCurrency = 'TWD';
        // 一律抓「以 USD 為基準」的匯率，其他幣別用交叉匯率計算，
        // 切換基準幣別時不必重抓，也不會用到錯的舊匯率
        let usdRates = null;
        let ratesUpdatedAt = 0;   // 匯率資料本身的更新時間
        let ratesFetchedAt = 0;   // 本機上次成功抓取的時間
        let ratesLoading = false;

        const cachedRates = loadJSON('calc-rates');
        if (cachedRates && cachedRates.rates) {
            usdRates = cachedRates.rates;
            ratesUpdatedAt = cachedRates.updatedAt || 0;
            ratesFetchedAt = cachedRates.fetchedAt || 0;
        }

        const STATUS_STYLES = {
            loading: 'bg-blue-50 text-blue-500',
            ok: 'bg-green-50 text-green-600',
            warn: 'bg-amber-50 text-amber-600',
            error: 'bg-red-50 text-red-500'
        };

        function setStatus(type, text) {
            rateStatus.textContent = text;
            rateStatus.className = `text-[10px] px-2 py-1 rounded-full font-medium ${STATUS_STYLES[type]}`
                + (currentAppMode === 'currency' ? '' : ' hidden');
        }

        function formatTime(ts) {
            return new Date(ts).toLocaleString('zh-TW', {
                month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false
            });
        }

        async function fetchRates() {
            if (ratesLoading) return;
            ratesLoading = true;
            setStatus('loading', '正在同步...');
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (data.result !== 'success' || !data.rates) throw new Error('bad data');
                const rates = {};
                CURRENCIES.forEach(c => { rates[c] = data.rates[c]; });
                if (CURRENCIES.some(c => !rates[c])) throw new Error('missing currency');

                usdRates = rates;
                ratesUpdatedAt = data.time_last_update_unix ? data.time_last_update_unix * 1000 : Date.now();
                ratesFetchedAt = Date.now();
                saveJSON('calc-rates', { rates, updatedAt: ratesUpdatedAt, fetchedAt: ratesFetchedAt });
                setStatus('ok', '匯率更新於 ' + formatTime(ratesUpdatedAt));
            } catch (error) {
                if (usdRates) setStatus('warn', '離線 · 使用 ' + formatTime(ratesUpdatedAt) + ' 匯率');
                else setStatus('error', '連線失敗，點此重試');
            } finally {
                ratesLoading = false;
                updateConversions();
            }
        }

        function getRate(from, to) {
            return usdRates[to] / usdRates[from];
        }

        function changeBaseCurrency(newBase) {
            if (baseCurrency === newBase) return;
            baseCurrency = newBase;
            baseSymbol.innerText = newBase;
            CURRENCIES.forEach(curr => {
                const btn = document.getElementById(`btn-${curr.toLowerCase()}`);
                btn.classList.toggle('currency-base-active', curr === newBase);
            });
            updateConversions();
        }

        function updateConversions() {
            const val = isError ? NaN : parseFloat(currentInput);
            const targets = CURRENCIES.filter(c => c !== baseCurrency);

            if (isNaN(val) || val === 0 || !usdRates) {
                conversionDisplay.innerHTML = targets.map(curr => `
                    <div class="flex flex-col items-start min-w-[80px]">
                        <span class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">${curr}</span>
                        <span class="text-sm font-semibold text-slate-400">---</span>
                    </div>
                `).join('<div class="w-px h-6 bg-slate-200 shrink-0"></div>');
                return;
            }

            conversionDisplay.innerHTML = targets.map((curr, idx) => {
                const convertedVal = val * getRate(baseCurrency, curr);
                const symbol = curr === 'JPY' ? '¥' : (curr === 'USD' ? '$' : 'NT$');
                const formatted = convertedVal.toLocaleString(undefined, {
                    minimumFractionDigits: curr === 'JPY' ? 0 : 2,
                    maximumFractionDigits: curr === 'JPY' ? 0 : 2
                });

                return `
                    <div class="flex flex-col items-start min-w-[100px]">
                        <span class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">${curr} 換算</span>
                        <span class="text-sm font-bold text-slate-700">${symbol} ${formatted}</span>
                    </div>
                    ${idx < targets.length - 1 ? '<div class="w-px h-6 bg-slate-200 shrink-0"></div>' : ''}
                `;
            }).join('');
        }

        // ================= 顯示 =================
        function prettyExpression(expr) {
            return expr.split(' ').map(t => OP_SYMBOLS[t] || t).join(' ');
        }

        const SIZE_STEPS = [
            { max: 9,        cls: ['text-4xl', 'md:text-5xl'] },
            { max: 12,       cls: ['text-3xl', 'md:text-4xl'] },
            { max: 15,       cls: ['text-2xl', 'md:text-3xl'] },
            { max: Infinity, cls: ['text-xl',  'md:text-2xl'] }
        ];
        const ALL_SIZE_CLASSES = SIZE_STEPS.flatMap(s => s.cls);

        function updateDisplay() {
            displayCurrent.innerText = currentInput;
            displayFormula.innerText = prettyExpression(formula);
            // 數字太長時自動縮小字體，避免斷行
            const step = SIZE_STEPS.find(s => currentInput.length <= s.max);
            displayCurrent.classList.remove(...ALL_SIZE_CLASSES);
            displayCurrent.classList.add(...step.cls);
        }

        // ================= 計算邏輯 =================
        function startNewInput(number) {
            currentInput = number === '.' ? '0.' : number;
        }

        function appendNumber(number) {
            if (isResultDisplayed || isError) {
                formula = '';
                isResultDisplayed = false;
                isError = false;
                waitingForOperand = false;
                startNewInput(number);
            } else if (waitingForOperand) {
                waitingForOperand = false;
                startNewInput(number);
            } else {
                if (number === '.' && currentInput.includes('.')) return;
                if (currentInput.replace(/[^0-9]/g, '').length >= MAX_DIGITS) return;
                if (currentInput === '0' && number !== '.') currentInput = number;
                else currentInput += number;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (isError) return;
            if (isResultDisplayed) {
                formula = currentInput + ' ' + op + ' ';
                isResultDisplayed = false;
            } else if (waitingForOperand) {
                // 連按運算子：替換最後一個
                formula = formula.trim().split(' ').slice(0, -1).join(' ') + ' ' + op + ' ';
            } else {
                formula += currentInput + ' ' + op + ' ';
            }
            waitingForOperand = true;
            currentInput = '0';
            updateDisplay();
        }

        function clearAll() {
            currentInput = '0';
            formula = '';
            isResultDisplayed = false;
            waitingForOperand = false;
            isError = false;
            updateDisplay();
        }

        function deleteLast() {
            if (isError) {
                clearAll();
                return;
            }
            if (isResultDisplayed) {
                formula = '';
                isResultDisplayed = false;
                updateDisplay();
                return;
            }
            if (waitingForOperand) {
                // 刪掉運算子，回到上一個數字繼續編輯
                const parts = formula.trim().split(' ');
                parts.pop();
                const lastNumber = parts.pop();
                formula = parts.length > 0 ? parts.join(' ') + ' ' : '';
                currentInput = lastNumber || '0';
                waitingForOperand = false;
            } else if (currentInput.length > 1 && currentInput !== '-0') {
                currentInput = currentInput.slice(0, -1);
                if (currentInput === '-') currentInput = '0';
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        // 只處理「數字 運算子 數字 ...」，先乘除後加減；不使用 eval / new Function
        function evaluate(expr) {
            const tokens = expr.trim().split(/\s+/);
            const nums = [parseFloat(tokens[0])];
            const ops = [];
            for (let i = 1; i < tokens.length; i += 2) {
                const op = tokens[i];
                const n = parseFloat(tokens[i + 1]);
                if (op === '*') nums.push(nums.pop() * n);
                else if (op === '/') nums.push(nums.pop() / n);
                else { ops.push(op); nums.push(n); }
            }
            let result = nums[0];
            ops.forEach((op, i) => {
                result = op === '+' ? result + nums[i + 1] : result - nums[i + 1];
            });
            return result;
        }

        function formatResult(n) {
            // 保留 12 位有效數字以消除浮點誤差（例如 0.1 + 0.2）
            return String(parseFloat(n.toPrecision(12)));
        }

        function calculate() {
            if (isResultDisplayed || isError || formula === '') return;
            const fullExpression = waitingForOperand
                ? formula.trim().split(' ').slice(0, -1).join(' ')
                : formula + currentInput;

            const result = evaluate(fullExpression);
            formula = fullExpression + ' =';
            isResultDisplayed = true;
            waitingForOperand = false;

            if (!isFinite(result)) {
                currentInput = '無法計算';
                isError = true;
                vibrate(true);
            } else {
                currentInput = formatResult(result);
                addToHistory(fullExpression, currentInput);
            }
            updateDisplay();
        }

        // ================= 歷史紀錄 =================
        function addToHistory(expr, res) {
            history.unshift({ expression: prettyExpression(expr), result: res });
            if (history.length > 5) history.pop();
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="text-slate-400 text-xs italic">尚無歷史紀錄</div>';
                return;
            }
            historyList.innerHTML = history.map((item, index) => `
                <div class="history-item bg-white p-3 rounded-xl border border-slate-200 shadow-sm active:bg-blue-50 cursor-pointer" onclick="handleAction(() => useHistory(${index}))">
                    <div class="text-[10px] text-slate-400 mb-1">${item.expression}</div>
                    <div class="text-sm font-bold text-slate-700 text-right">= ${item.result}</div>
                </div>
            `).join('');
        }

        function useHistory(index) {
            currentInput = history[index].result;
            formula = '';
            isResultDisplayed = true;
            waitingForOperand = false;
            isError = false;
            updateDisplay();
        }

        // ================= 實體鍵盤 =================
        const KEY_ACTIONS = {
            '.': () => appendNumber('.'),
            ',': () => appendNumber('.'),
            '+': () => appendOperator('+'),
            '-': () => appendOperator('-'),
            '*': () => appendOperator('*'),
            'x': () => appendOperator('*'),
            '/': () => appendOperator('/'),
            'Enter': () => calculate(),
            '=': () => calculate(),
            'Escape': () => clearAll(),
            'Delete': () => clearAll(),
            'Backspace': () => deleteLast()
        };

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            const action = /^[0-9]$/.test(e.key) ? () => appendNumber(e.key) : KEY_ACTIONS[e.key];
            if (!action) return;
            // 阻止預設行為：避免 Enter 同時「點擊」到目前有焦點的按鈕、Firefox 按 / 開啟搜尋
            e.preventDefault();
            feedback();
            handleAction(action);
        });

        // ================= 初始化 =================
        renderSettings();
        updateConversions();

        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
